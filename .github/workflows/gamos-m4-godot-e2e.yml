name: gamos-m4-godot-e2e

# Gamos M4 WP-2 — Godot real-engine integration gate (delivery plan §3 order 2;
# regression matrix row "Godot journeys added by WP-2"; the m2-e2e/m3-e2e
# real-engine job pattern applied to the Godot line).
#
#   Job "godot-real-engine": provisions the PINNED zero-cost Godot recipe
#     (M4-ZERO-COST-DELIVERY.md — official release channel, sha256-pinned
#     editor zip, secondary-pinned version assertion, byte-exact export
#     templates; pre-approved CI engine install per directive §8, never a
#     silent install by the APPLICATION) and runs the godot-engine-plugin
#     FULL suite against it: family-grammar discovery, typed-ops path safety,
#     the harden taxonomy, and the real integration gate — project.godot
#     read-back by the real engine, typed scene modify with FRESH-process
#     read-back verification + atomic-failure byte-identity, --check-only
#     positive+negative, real asset import with filesystem probe, headless
#     export with artifact sha256 + size bounds + pck detection, headless run
#     with the exit-0-AND-zero-crash-lines discipline, runaway process-group
#     kill with no-orphan assertions, and abort-signal cancellation.
#     REQUIRED to pass — a unit-test pass never stands in for the engine.
#
#   M4-G1 honesty: this job verifies the WP-2 PLUGIN LAYER of the gate. M4-G1
#     ("a real Godot project completes discovery, modification, headless
#     execution/build/test and evidence collection") stays UNPASSED until the
#     delivery plan's remaining legs close (WP-3 real Blender→Godot cross-engine
#     hop with engine read-back; the M4 evidence collection per §9). The
#     recorded gate status says exactly this — the roadmap completion check
#     refuses M4 completion without the full gate evidence, and this workflow
#     never claims it.
#
# Honest-evidence rules (inherited): the gate status is derived from the
# suite's own exit code; evidence artifacts are uploaded; no key material is
# ever committed.

on:
  push:
    branches: ["gamos/**"]
    paths:
      - "packages/gamos-domain/**"
      - "apps/zcode-cli/packages/godot-engine-plugin/**"
      - ".github/workflows/gamos-m4-godot-e2e.yml"
  workflow_dispatch:

env:
  # The pinned zero-cost recipe (M4-ZERO-COST-DELIVERY.md): official release
  # channel, primary zip sha256 + secondary version-string assertion.
  GODOT_ZIP_SHA256: "69eb9881e1b82ab93924c83106a7c031497f252bc0c08e199e4da6380072d6ef"
  GODOT_VERSION_STRING: "4.2.2.stable.official.15073afe3"
  # Byte-exact template pins (the verified recipe's own evidence standard —
  # the engine reads exactly these two files for linux export).
  GODOT_TEMPLATE_RELEASE_BYTES: "62204152"
  GODOT_TEMPLATE_DEBUG_BYTES: "61544792"

permissions:
  contents: read

jobs:
  godot-real-engine:
    name: Godot real engine integration (M4 WP-2; M4-G1 plugin layer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile || (echo "::warning::retrying install" && pnpm install --frozen-lockfile)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Provision the pinned Godot 4.2.2 (pre-approved CI engine install; hashes recorded)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/engines/godot-4.2.2-stable-linux-x64"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/engines/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip"
          echo "${GODOT_ZIP_SHA256}  $RUNNER_TEMP/engines/godot.zip" | sha256sum --check --strict -
          # Layout note (verified recipe): the zip extracts a single top-level
          # binary; the environment layout is the DIRECTORY form so both path
          # conventions resolve.
          unzip -o -q "$RUNNER_TEMP/engines/godot.zip" -d "$RUNNER_TEMP/engines/godot-4.2.2-stable-linux-x64/"
          BIN="$RUNNER_TEMP/engines/godot-4.2.2-stable-linux-x64/Godot_v4.2.2-stable_linux.x86_64"
          sudo mkdir -p /home/z/engines
          sudo ln -sfn "$RUNNER_TEMP/engines/godot-4.2.2-stable-linux-x64" /home/z/engines/godot-4.2.2-stable-linux-x64
          VERSION_OUT="$("$BIN" --version)"
          echo "engine version: $VERSION_OUT"
          if [ "$VERSION_OUT" != "$GODOT_VERSION_STRING" ]; then
            echo "::error::Godot version assertion failed: expected $GODOT_VERSION_STRING, got $VERSION_OUT"
            exit 1
          fi
      - name: Provision the pinned export templates (linux pair; byte-exact verification)
        run: |
          set -e
          curl -sSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
          unzip -o -q "$RUNNER_TEMP/templates.tpz" "templates/linux_release.x86_64" "templates/linux_debug.x86_64" -d "$RUNNER_TEMP/tmpl/"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          cp "$RUNNER_TEMP/tmpl/templates/linux_release.x86_64" "$RUNNER_TEMP/tmpl/templates/linux_debug.x86_64" \
            "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
          REL_BYTES="$(stat -c %s "$HOME/.local/share/godot/export_templates/4.2.2.stable/linux_release.x86_64")"
          DBG_BYTES="$(stat -c %s "$HOME/.local/share/godot/export_templates/4.2.2.stable/linux_debug.x86_64")"
          echo "linux_release.x86_64: $REL_BYTES B (expected ${GODOT_TEMPLATE_RELEASE_BYTES})"
          echo "linux_debug.x86_64: $DBG_BYTES B (expected ${GODOT_TEMPLATE_DEBUG_BYTES})"
          if [ "$REL_BYTES" != "$GODOT_TEMPLATE_RELEASE_BYTES" ] || [ "$DBG_BYTES" != "$GODOT_TEMPLATE_DEBUG_BYTES" ]; then
            echo "::error::export template byte-exact verification failed (pinned recipe integrity)"
            exit 1
          fi
      - name: Build the godot-engine-plugin (the manifest-declared dist artifact)
        run: pnpm --filter @zcode/godot-engine-plugin build
      - name: Run the godot-engine-plugin FULL suite (real engine + templates)
        run: |
          set -o pipefail
          mkdir -p evidence/phase-m4
          pnpm --filter @zcode/godot-engine-plugin exec vitest run test 2>&1 | tee evidence/phase-m4/godot-suite-output.txt
      - name: "Write the M4-G1 gate status (honest: plugin layer verified; gate stays open)"
        if: always()
        run: |
          mkdir -p evidence/phase-m4
          cat > evidence/phase-m4/godot-gate-status.json <<'JSON'
          {
            "gate_id": "M4-G1",
            "job": "godot-real-engine",
            "engine": {
              "family": "godot",
              "version": "4.2.2.stable.official.15073afe3",
              "source": "github.com/godotengine/godot releases (official channel, pinned recipe)",
              "zip_sha256": "${{ env.GODOT_ZIP_SHA256 }}",
              "export_templates": "linux pair byte-exact (release 62204152 B / debug 61544792 B)"
            },
            "status": "engine-layer-verified",
            "scope_note": "M4 WP-2 plugin layer only: discovery + typed operations through the committed data-only GDScript bridge, all six capabilities verified against the real engine. M4-G1 remains UNPASSED until WP-3 (real Blender→Godot cross-engine hop with engine read-back) and the §9 evidence collection close; this status never claims gate completion.",
            "recorded_at": "${{ github.run_id }}-${{ github.run_attempt }}"
          }
          JSON
      - name: Upload M4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-godot-${{ github.sha }}
          path: evidence/phase-m4/
          if-no-files-found: warn
