name: gamos-governance

# Gamos preservation gate (ADR-0003 + ADR-0004).
#   Job 1 "governance": hash-pinned structural verification against the pinned
#     upstream baseline (trust-anchor pin, control-file hashes, authorization
#     schema v2 with content binding, protected-file existence, unauthorized
#     deletions/modifications of baseline-tracked files, history-rewrite guard).
#   Job 2 "self-test": tamper-rejection suite proving unauthorized changes to
#     governance controls are rejected (14 scenarios, synthetic fixtures).
#   Job 3 "architecture": upstream's module/layering gate plus the Gamos roadmap
#     structural/dependency/evidence gate and its self-tests. It remains the
#     same required status check, so a roadmap violation blocks integration.
#
# Trust anchor: GAMOS_BASELINE_SHA256 below is sha256 of
# .gamos-architecture-baseline.json. Rotated only via
# scripts/gamos/governance-rebaseline.mjs in a TL-reviewed change (ADR-0004).

on:
  push:
    branches: ["main", "gamos/**"]
  pull_request:
    branches: ["main", "gamos/**"]
  schedule:
    - cron: "17 3 * * *" # daily independent verification of the default branch
  workflow_dispatch:

env:
  GAMOS_BASELINE_SHA256: "da3fbbd9a2dc16e59f50ef45d9a28d6cf5a9051178f33882b1df9d972d8e663b"

permissions:
  contents: read

jobs:
  governance:
    name: Governance (baseline & protected surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: baseline-ancestor + tag verification need it
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Gamos governance verifier (trust-anchor pinned)
        run: node scripts/gamos/governance-check.mjs --pin "$GAMOS_BASELINE_SHA256"

  self-test:
    name: Governance self-test (tamper rejection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tamper-rejection self-tests (14 scenarios)
        run: node scripts/gamos/governance-self-test.mjs

  architecture:
    name: Upstream architecture gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile || (echo "::warning::retrying install after known pnpm@10.33.2 hoisted-linker ENOENT race (react-scan/esbuild rename)" && pnpm install --frozen-lockfile)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Architecture check
        run: pnpm run architecture:check
      - name: Roadmap validator self-tests
        run: node scripts/gamos/roadmap-self-test.mjs
      - name: Canonical roadmap integrity and dependency gate
        run: node scripts/gamos/roadmap-check.mjs
