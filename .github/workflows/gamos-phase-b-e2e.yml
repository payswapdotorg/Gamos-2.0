name: gamos-phase-b-e2e

# Gamos Phase B — original-application verification on a properly resourced runner
# (M0 acceptance, docs/gamos/MILESTONES-AND-ACCEPTANCE.md; ADR-0005/ADR-0006).
#
#   Job "desktop-journey": builds the COMPLETE original application (including the
#     production desktop renderer) and drives the actual user journey through the
#     original UI with a REAL model (OpenRouter) — strict verdict integrity
#     (scripts/gamos/phase-b-ui-journey.mjs rev 2: exit 0 only when every mandatory
#     stage S0–S9 records pass; partial/skipped/fail/missing all fail the job).
#     All interactions use CDP Input domain events; Terminal command output,
#     Review approve AND reject, embedded-browser guest URL/content, marketplace
#     plugin identity + install + sha256, and session recovery are verified
#     against exact expected results. Screenshots + JSON evidence are uploaded.
#
#   Job "inherited-desktop-e2e": runs the applicable INHERITED desktop E2E suite
#     through the upstream-sanctioned container path
#     (Dockerfile.desktop-e2e + scripts/test-desktop-e2e-container.sh) in
#     replay-isolated network mode with the four verified specs. The
#     upstream-provider spec is EXCLUDED from this preset (see the
#     upstream-provider-replay job below) — no claim is made that the complete
#     upstream suite passes based on this subset.
#
#   Job "upstream-provider-replay": runs the previously EXCLUDED
#     upstream-provider.test.ts through the upstream-documented replay path
#     (docs/testing/upstream-provider-e2e.md "默认固定回放"): the spec replays the
#     IN-REPO recorded fixture
#     packages/desktop/test/e2e/fixtures/upstream/provider-basic.json (the
#     "capture once, replay fixed" regression — no live network, no real key;
#     E2E_PROVIDER_REPLAY_FIXTURE_PATH is the upstream-supported env that puts
#     this spec's worker into replay mode; model ids default to the recorded
#     fixtures per upstream-recorded-models.ts; the expected reply text env
#     matches the recorded fixture reply "deepseek-e2e-ok").
#
#     Live-provider investigation outcome (architect directive §3), recorded
#     honestly: a live run is NOT executable with the available OpenRouter
#     credential. The E2E env-preset provider always composes the anthropic
#     gateway path <base>/anthropic/v1/messages (wdio.conf.ts
#     buildUpstreamE2EAnthropicBaseUrl + normalizeAnthropicBaseURL in
#     apps/zcode-cli/packages/adapters/src/model/model-execution.ts), a path
#     OpenRouter does not serve: verified with a REAL request through the E2E
#     capture proxy in run 41987983424 (job upstream-provider-live, 404 Not
#     Found at https://openrouter.ai/api/anthropic/v1/messages). No claim is
#     made that this spec passes against a live provider; the replay-fixture
#     run above is the legitimate recorded-replay evidence path.
#
# The sandbox cannot complete these (3GB RAM / 2 vCPU / no Docker): production
# renderer bundling OOMs there and the dev-renderer module graph exhausts
# Chromium's per-process request budget. This workflow is the "suitable
# environment" required by the M0 re-review directive.

on:
  push:
    branches: ["gamos/**"]
    paths:
      - "scripts/gamos/phase-b-ui-journey.mjs"
      - ".github/workflows/gamos-phase-b-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: "10.33.2"

jobs:
  desktop-journey:
    name: Phase B desktop journey (real model, production renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PHASEB_MODE: prod
      PHASEB_EVIDENCE_DIR: evidence/phase-b/journey-ci
      PHASEB_HOME: ${{ github.workspace }}/.phaseb-home
      PHASEB_STAGED_APP_DIR: ${{ github.workspace }}/.phaseb-app
      PHASEB_MAX_WAIT_MS: "600000"
      PHASEB_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install display + electron runtime dependencies
        run: |
          sudo apt-get update -qq
          # ubuntu-24.04 t64 transition: libasound2 is virtual, provided by libasound2t64.
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus dbus-x11 \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcairo2 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libsecret-1-0 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 libxrender1 libxshmfence1 \
            libxss1 libxtst6 fonts-noto-cjk fonts-noto-color-emoji

      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile || (echo "::warning::retrying install after known pnpm@10.33.2 hoisted-linker ENOENT race (react-scan/esbuild rename)" && pnpm install --frozen-lockfile)

      - name: Build desktop agent CLI chain (runtime agent bundle)
        run: node scripts/build-desktop-agent-cli.mjs

      - name: Prepare desktop runtime assets (agent bundle + native search tools)
        run: pnpm --filter @zcode/desktop prepare:runtime-assets

      - name: Build the complete application (all packages + desktop production renderer)
        run: pnpm build:bootstrap

      - name: Verify production renderer output
        run: ls -la packages/desktop/out/renderer/ | head -12

      - name: Run the original-application UI journey (real model, strict verdict)
        env:
          OPENROUTER_API_KEY: ${{ secrets.PHASEB_OPENROUTER_API_KEY }}
        run: |
          ulimit -n 65535 || true
          # Fresh isolated home per run: the journey requires the first-run
          # onboarding wizard (S1) and verifies provider/workspace state on disk.
          rm -rf "${PHASEB_HOME}"
          node scripts/gamos/phase-b-ui-journey.mjs

      - name: Verify journey evidence verdict (machine-readable summary)
        if: always()
        run: |
          if [ ! -f evidence/phase-b/journey-ci/journey-evidence.json ]; then
            echo "::error::journey-evidence.json missing — journey did not produce evidence"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open("evidence/phase-b/journey-ci/journey-evidence.json"))
          s = d.get("summary", {})
          print("verdict:", s.get("verdict"))
          print("non_pass_stages:", json.dumps(s.get("non_pass_stages", []), indent=1))
          print("missing_stages:", json.dumps(s.get("missing_stages", []), indent=1))
          for sid, st in sorted(d.get("stages", {}).items()):
              print(f"  {sid}: {st.get('status')}")
          sys.exit(0 if s.get("verdict") == "pass" else 1)
          PY

      - name: Scan evidence artifacts for accidental key exposure
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.PHASEB_OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then echo "no key configured — skip"; exit 0; fi
          set +e
          grep -r -l -F "${OPENROUTER_API_KEY}" evidence/phase-b/journey-ci/ > /tmp/key-hits.txt 2>/dev/null
          rc=$?
          set -e
          if [ -s /tmp/key-hits.txt ]; then
            echo "::error::OpenRouter key found in evidence artifacts:"
            cat /tmp/key-hits.txt
            exit 1
          fi
          echo "key-exposure scan clean: no evidence artifact contains the OpenRouter key"

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-journey-${{ github.sha }}
          path: |
            evidence/phase-b/journey-ci/
          if-no-files-found: warn
          retention-days: 30

  inherited-desktop-e2e:
    name: Inherited desktop E2E (container, 4 verified specs)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Four verified specs (the upstream-provider spec is EXCLUDED from this
      # preset: it requires either a pre-recorded provider replay fixture
      # (E2E_PROVIDER_REPLAY_FIXTURE_PATH — not present in this repository and
      # not fabricated) or a live provider; it is executed LIVE in the
      # upstream-provider-live job below. Until that job passes, its status
      # remains explicitly excluded. No claim is made that the complete
      # upstream suite passes based on this subset.)
      E2E_SPEC: "./test/e2e/container-boot.test.ts,./test/e2e/smoke.test.ts,./test/e2e/e2ecase-regression.test.ts,./test/e2e/task-list-archive-confirmation.test.ts"
    steps:
      - uses: actions/checkout@v4

      - name: Run the upstream container E2E suite (verified specs)
        # Retry once on the known pnpm@10.33.2 hoisted-linker ENOENT race inside
        # the container image build (react-scan/esbuild rename — same workaround as
        # the desktop-journey install step). Docker layer cache makes the retry cheap.
        run: bash scripts/test-desktop-e2e-container.sh || (echo "::warning::retrying after known pnpm@10.33.2 hoisted-linker ENOENT race in the container image build" && bash scripts/test-desktop-e2e-container.sh)

      - name: Upload container E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-inherited-e2e-${{ github.sha }}
          # include-hidden-files: .e2e-artifacts is a dot-directory — hidden paths
          # are skipped by default (previous runs silently uploaded nothing).
          path: |
            packages/desktop/.e2e-artifacts/
            packages/desktop/.e2e-network-capture/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  upstream-provider-replay:
    name: Inherited upstream-provider spec (in-repo recorded replay fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The previously EXCLUDED upstream-provider spec, now executed through the
      # upstream-documented fixed-replay path (docs/testing/upstream-provider-e2e.md):
      # E2E_PROVIDER_REPLAY_FIXTURE_PATH forces this spec's worker into replay mode
      # (packages/desktop/test/e2e/helpers/upstream-replay-fixture-resolution.ts
      # "allows pending manual-review to replay an explicit fixture" — the mode the
      # spec's own unit tests define for this route) and loads the in-repo recorded
      # fixture pool. The direct (non-container) invocation is the documented one:
      # scripts/test-desktop-e2e-container.sh does not forward
      # E2E_PROVIDER_REPLAY_FIXTURE_PATH into the container.
      #
      # Model ids are the recorded fixture models (upstream-recorded-models.ts);
      # E2E_PROVIDER_MODEL only takes effect in capture mode but is set to the
      # recorded value for the seeded provider catalog. The request prompt is
      # pinned EXPLICITLY to the recorded fixture's prompt shape ("upstream-e2e-ok"
      # — the upstream-provider-basic matcher's bodyIncludes token): deriving it
      # from E2E_PROVIDER_EXPECT_REPLY_TEXT alone (the spec's default) changed the
      # prompt to "deepseek-e2e-ok", matched no fixture, and every request 500'd
      # with "Missing Upstream e2e fixture" (run 42040326209 capture evidence).
      # E2E_PROVIDER_EXPECT_REPLY_TEXT matches the recorded fixture's reply text
      # ("deepseek-e2e-ok" — the recorded SSE text deltas). Thought-level
      # assertions are disabled (E2E_PROVIDER_THOUGHT_LEVEL=""): the ordinary
      # replay seed's reasoning map is "{}" (wdio.conf.ts: "只有专项 wire 用例注入
      # 思考参数；普通 replay 的响应节奏由 fixture 控制"), so the recorded request
      # carries no thinking config to assert. No real API key is used: replay mode
      # forces the e2e-fixture-key.
      ZCODE_E2E_SPEC: "./test/e2e/upstream-provider.test.ts"
      E2E_PROVIDER_PRESET: env
      E2E_PROVIDER_MODEL: deepseek-v4-flash
      E2E_PROVIDER_SECONDARY_MODEL: deepseek-v4-pro
      E2E_PROVIDER_PROMPT: 'Reply with exactly "upstream-e2e-ok" and no other text.'
      E2E_PROVIDER_EXPECT_REPLY_TEXT: deepseek-e2e-ok
      E2E_PROVIDER_THOUGHT_LEVEL: ""
      E2E_PROVIDER_REPLAY_FIXTURE_PATH: packages/desktop/test/e2e/fixtures/upstream/provider-basic.json
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install display + electron runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus dbus-x11 \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcairo2 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libsecret-1-0 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 libxrender1 libxshmfence1 \
            libxss1 libxtst6 fonts-noto-cjk fonts-noto-color-emoji

      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile || (echo "::warning::retrying install after known pnpm@10.33.2 hoisted-linker ENOENT race (react-scan/esbuild rename)" && pnpm install --frozen-lockfile)

      - name: Run the upstream-provider spec against the in-repo recorded replay fixture
        # Same invocation the E2E container CMD uses (dbus-run-session --
        # pnpm --filter @zcode/desktop test:e2e), executed directly on the runner
        # per docs/testing/upstream-provider-e2e.md. wdio only auto-starts Xvfb
        # inside the E2E container (wdio.conf.ts autoXvfb is containerE2E-gated),
        # so Xvfb is started explicitly; the chromedriver build matching the
        # pinned Electron version is prefetched with the same
        # chromedriver-preflight.mjs prepare/path preflight the container script
        # runs, and passed via CHROMEDRIVER_PATH (outside the container, wdio's
        # beforeSession only computes the executable path — it does not install
        # it; first attempt failed with spawn ENOENT at /tmp/chromedriver/...).
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR > /tmp/xvfb.log 2>&1 &
          sleep 3
          node packages/desktop/scripts/chromedriver-preflight.mjs prepare /tmp/chromedriver-e2e
          export CHROMEDRIVER_PATH="$(node packages/desktop/scripts/chromedriver-preflight.mjs path /tmp/chromedriver-e2e)"
          echo "CHROMEDRIVER_PATH=${CHROMEDRIVER_PATH}"
          dbus-run-session -- pnpm --filter @zcode/desktop test:e2e

      - name: Scan artifacts for accidental key exposure
        if: always()
        env:
          E2E_PROVIDER_API_KEY: ${{ secrets.PHASEB_OPENROUTER_API_KEY }}
        run: |
          if [ -z "${E2E_PROVIDER_API_KEY}" ]; then echo "no key configured — skip (replay mode uses no real key)"; exit 0; fi
          set +e
          grep -r -l -F "${E2E_PROVIDER_API_KEY}" packages/desktop/.e2e-artifacts/ packages/desktop/.e2e-network-capture/ packages/desktop/.e2e-home/ > /tmp/key-hits.txt 2>/dev/null
          set -e
          if [ -s /tmp/key-hits.txt ]; then
            echo "::error::OpenRouter key found in E2E artifacts:"
            cat /tmp/key-hits.txt
            exit 1
          fi
          echo "key-exposure scan clean"

      - name: Upload upstream-provider replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-upstream-provider-replay-${{ github.sha }}
          # include-hidden-files: the E2E artifact roots are dot-directories
          # (.e2e-artifacts / .e2e-network-capture / .e2e-home) — upload-artifact
          # skips hidden paths by default and previous runs silently uploaded
          # nothing ("No files were found" warnings).
          path: |
            packages/desktop/.e2e-artifacts/
            packages/desktop/.e2e-network-capture/
            packages/desktop/.e2e-home/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
