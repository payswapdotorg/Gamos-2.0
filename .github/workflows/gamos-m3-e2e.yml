name: gamos-m3-e2e

# Gamos M3 — cross-engine pipeline verification (final-closure handoff §11–§12,
# M3-PREPARED-PLAN §6 "the real engine-backed pipelines and the real end-to-end
# M3 journey" CI legs).
#
#   Job "m3-domain-and-contracts": the focused gamos-domain suite (includes the
#     M3 cross-engine plan builder + asset-interchange contracts) + the M3
#     capability CLI plan-mode smoke (registry resolution + the engine-aware
#     GamePlan through buildCrossEngineAssetPlan + parseGamePlan validation).
#
#   Job "m3-runtime-gates": the G3/G4 real-runtime evidence suite —
#     GamosEngineDriver runs REAL Blender operations inside REAL Dynamic
#     Workflow steps; concurrency overlap, dependent serialization, the
#     resource-claim conflict gate, journal resume and cancellation are
#     proven against the production runtime. REQUIRED to pass.
#
#   Job "blender-real-engine" / "babylon-real-toolchain" / "unity-engine-status":
#     inherited from the M2 workflow verbatim (the same plugin surfaces the M3
#     pipeline calls: asset_export, asset_integrate, asset_import) — see
#     .github/workflows/gamos-m2-e2e.yml for the honest-evidence rules.
#
#   Job "m3-engine-journey": THE §11 cross-engine end-to-end journey through the
#     ORIGINAL ZCode application (CDP): plugins enabled through the real
#     Settings UI, the engine-aware GamePlan recorded, permission DENIAL then
#     approved real Blender modify+GLB export, the interchange manifest
#     persisted through the REAL M3.4 facility, the in-app manifest Read +
#     hash-verified asset_integrate, real vite build + dev-server run, THE
#     ORIGINAL ZCODE BROWSER verifies the integrated asset actually loaded
#     (meshes + vertices in-guest), project_stop cancellation, the Unity
#     asset_import honest-unavailable leg and the session-store history. A
#     deterministic local model endpoint drives the app (disclosed in the
#     evidence; no real-LLM authorship is claimed). REQUIRED to pass.
#
# Honest-evidence rules: every engine job uploads its evidence artifacts; no
# key material is ever committed. M3-G1 stays honestly blocked while no
# compliant licensed Unity runner exists — never fabricated, never claimed.

on:
  push:
    branches: ["gamos/**"]
    paths:
      - "packages/gamos-domain/**"
      - "apps/zcode-cli/packages/unity-engine-plugin/**"
      - "apps/zcode-cli/packages/blender-engine-plugin/**"
      - "apps/zcode-cli/packages/babylon-engine-plugin/**"
      - "apps/zcode-cli/packages/dynamic-workflow/**"
      - "apps/zcode-cli/packages/dynamic-workflow-runtime/**"
      - "scripts/gamos/m3-ui-journey.mjs"
      - "scripts/gamos/m3-local-model-server.mjs"
      - "scripts/gamos/m3-capability-cli.ts"
      - "apps/zcode-cli/packages/babylon-engine-plugin/test/fixture/**"
      - "apps/zcode-cli/packages/unity-engine-plugin/test/fixture/**"
      - ".github/workflows/gamos-m3-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "4.1.1"
  BLENDER_TARBALL_SHA256: "ab2ea3fe991601a5e6bd2cda786ecaa919c0b39e0550e59978b5d40270c260d3"

jobs:
  m3-domain-and-contracts:
    name: M3 domain + cross-engine contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile || (echo "::warning::retrying install after known pnpm@10.33.2 hoisted-linker ENOENT race" && pnpm install --frozen-lockfile)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Focused gamos-domain tests (cross-engine plan, asset interchange, resource claims)
        run: pnpm exec vitest run --project gamos-domain
      - name: Build the dynamic-workflow compiler (acceptance prerequisite)
        run: pnpm --filter @zcode/dynamic-workflow build
      - name: Cross-engine plan-builder real-compiler acceptance
        run: pnpm --filter @zcode/dynamic-workflow exec vitest run tests/gamos-plan-acceptance.test.ts
      - name: Bundle the M3 capability CLI (plan mode smoke)
        run: pnpm exec esbuild scripts/gamos/m3-capability-cli.ts --bundle --platform=node --format=esm --outfile=/tmp/m3-capability-cli.mjs
      - name: M3 capability CLI plan mode (registry + engine-aware GamePlan)
        run: |
          set -e
          node /tmp/m3-capability-cli.mjs > /tmp/m3-plan.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/m3-plan.json'))
          assert d['verdict'] == 'ok', f"verdict: {d['verdict']}"
          plan = d['plan']
          assert plan['validatedByParseGamePlan'] is True
          assert [s['stepId'] for s in plan['steps']] == ['export-asset', 'validate-export', 'integrate-asset', 'build-project', 'verify-runtime'], plan['steps']
          assert plan['resourceClaimCount'] == 9, plan['resourceClaimCount']
          unresolved = [c['id'] for c in d['capabilities'] if not c['resolved']]
          assert unresolved == ['unity/asset.import'], unresolved
          print('M3 plan-mode smoke: verdict ok, 5 steps, 9 claims, unity/asset.import honestly unresolved')
          PY

  m3-runtime-gates:
    name: M3-G3/G4 real-runtime engine gates (real Blender under the real runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile || (echo "::warning::retrying install" && pnpm install --frozen-lockfile)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Provision real Blender 4.1.1 (pre-approved CI engine install; hash recorded)
        run: |
          mkdir -p "$RUNNER_TEMP/engines"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/engines/blender.tar.xz" \
            "https://download.blender.org/release/Blender4.1/blender-4.1.1-linux-x64.tar.xz"
          echo "${BLENDER_TARBALL_SHA256}  $RUNNER_TEMP/engines/blender.tar.xz" | sha256sum --check --strict -
          tar -xf "$RUNNER_TEMP/engines/blender.tar.xz" -C "$RUNNER_TEMP/engines"
          "$RUNNER_TEMP/engines/blender-4.1.1-linux-x64/blender" --version | head -2
          sudo mkdir -p /home/z/engines
          sudo ln -sfn "$RUNNER_TEMP/engines/blender-4.1.1-linux-x64" /home/z/engines/blender-4.1.1-linux-x64
      - name: Build the dynamic-workflow compiler (runtime prerequisite)
        run: pnpm --filter @zcode/dynamic-workflow build
      - name: Run the G3/G4 real-runtime gates suite
        run: pnpm --filter @zcode/dynamic-workflow-runtime exec vitest run tests/gamos-engine-runtime.test.ts
        env:
          BLENDER_PATH: ${{ runner.temp }}/engines/blender-4.1.1-linux-x64/blender
      - name: Full dynamic-workflow-runtime regression (100 pre-existing + 7 gates)
        run: pnpm --filter @zcode/dynamic-workflow-runtime exec vitest run tests
        env:
          BLENDER_PATH: ${{ runner.temp }}/engines/blender-4.1.1-linux-x64/blender
      - name: Upload M3 runtime-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-runtime-gates-${{ github.sha }}
          path: |
            apps/zcode-cli/packages/dynamic-workflow-runtime/tests/gamos-evidence/
          if-no-files-found: warn

  m3-engine-journey:
    name: M3 §11 cross-engine journey (the original app; ZCode Browser; integrated-asset verification)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PHASEB_MODE: prod-http
      PHASEB_EVIDENCE_DIR: evidence/phase-m3/journey-ci
      PHASEB_HOME: ${{ github.workspace }}/.phaseb-m3-home
      PHASEB_STAGED_APP_DIR: ${{ github.workspace }}/.phaseb-m3-app
      PHASEB_MAX_WAIT_MS: "600000"
      M3_LOCAL_MODEL_PORT: "4374"
      M3_CAPABILITY_CLI: /tmp/m3-capability-cli.mjs
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@10.33.2" --activate
          pnpm --version
      - name: Install display + electron runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus dbus-x11 \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcairo2 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0 libsecret-1-0 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 libxrender1 libxshmfence1 \
            libxss1 libxtst6 fonts-noto-cjk fonts-noto-color-emoji
      - name: Provision real Blender 4.1.1 (pre-approved CI engine install; hash recorded)
        run: |
          mkdir -p "$RUNNER_TEMP/engines"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/engines/blender.tar.xz" \
            "https://download.blender.org/release/Blender4.1/blender-4.1.1-linux-x64.tar.xz"
          echo "${BLENDER_TARBALL_SHA256}  $RUNNER_TEMP/engines/blender.tar.xz" | sha256sum --check --strict -
          tar -xf "$RUNNER_TEMP/engines/blender.tar.xz" -C "$RUNNER_TEMP/engines"
          "$RUNNER_TEMP/engines/blender-4.1.1-linux-x64/blender" --version | head -2
          sudo mkdir -p /home/z/engines
          sudo ln -sfn "$RUNNER_TEMP/engines/blender-4.1.1-linux-x64" /home/z/engines/blender-4.1.1-linux-x64
      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile || (echo "::warning::retrying install after known pnpm@10.33.2 hoisted-linker ENOENT race" && pnpm install --frozen-lockfile)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Bundle the M3 capability CLI (gamos-domain -> single-file ESM)
        run: pnpm exec esbuild scripts/gamos/m3-capability-cli.ts --bundle --platform=node --format=esm --outfile=/tmp/m3-capability-cli.mjs
      - name: Build desktop agent CLI chain (runtime agent bundle + engine plugin dists)
        run: node scripts/build-desktop-agent-cli.mjs
      - name: Prepare desktop runtime assets (agent bundle + native search tools)
        run: pnpm --filter @zcode/desktop prepare:runtime-assets
      - name: Build the complete application (all packages + desktop production renderer)
        run: pnpm build:bootstrap
      - name: Verify production renderer output
        run: ls -la packages/desktop/out/renderer/ | head -12
      - name: Run the M3 §11 cross-engine journey (strict verdict; real Blender; ZCode Browser integrated-asset verification)
        run: |
          set -e
          export M3_BLENDER_PATH="$RUNNER_TEMP/engines/blender-4.1.1-linux-x64/blender"
          node scripts/gamos/m3-ui-journey.mjs
      - name: Verify M3 journey evidence verdict (machine-readable summary)
        run: |
          set -e
          if [ ! -f evidence/phase-m3/journey-ci/m3-journey-evidence.json ]; then
            echo "::error::m3 journey evidence file missing — journey did not produce evidence"
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('evidence/phase-m3/journey-ci/m3-journey-evidence.json'))
          summary = d.get('summary', {})
          assert summary.get('verdict') == 'pass', f"journey verdict: {summary.get('verdict')} non_pass={summary.get('non_pass_stages')} missing={summary.get('missing_stages')}"
          m3 = d.get('m3', {}).get('cross_engine_journey', {})
          ce = d.get('stages', {}).get('M3J4', {}).get('detail', {})
          browser = ce.get('browser_verification', {}).get('assertions', {})
          assert browser.get('integrated_asset_loaded') is True, browser
          assert browser.get('integrated_assets_ready') is True, browser
          assert browser.get('integrated_asset_no_error') is True, browser
          assert m3.get('denial_blocked_mutation') is True
          assert m3.get('interchange_manifest', {}).get('status') == 'exported'
          assert m3.get('integration', {}).get('staged_asset', {}).get('matches_export') is True
          assert m3.get('cancellation', {}).get('stop_verified') is True
          unity = d.get('m3', {}).get('unity', {})
          assert unity.get('honest_unavailable') is True, unity
          print('M3 journey verdict: pass — integrated asset consumed in the running browser, manifest integrity chain intact, cancellation verified, Unity honestly unavailable')
          PY
          # The journey uses no external credential (local deterministic model
          # endpoint) — scan the evidence for accidental key material.
          if grep -r -l -E "ghp_|sk-or-v1|vcp_|napi_|ck_|e2b_" evidence/phase-m3/journey-ci/ > /dev/null 2>&1; then
            echo "::error::key-like material found in the journey evidence"
            grep -r -l -E "ghp_|sk-or-v1|vcp_|napi_|ck_|e2b_" evidence/phase-m3/journey-ci/ || true
            exit 1
          fi
      - name: Write the M3-G2/M3-G5 journey-leg gate statuses
        if: always()
        run: |
          mkdir -p evidence/phase-m3/journey-ci
          python3 - <<'PY'
          import json, os
          path = "evidence/phase-m3/journey-ci/m3-journey-evidence.json"
          if not os.path.exists(path):
              raise SystemExit("journey evidence missing — status not written")
          d = json.load(open(path))
          m3 = d.get("m3", {}).get("cross_engine_journey", {})
          ce = d.get("stages", {}).get("M3J4", {}).get("detail", {})
          browser = ce.get("browser_verification", {}).get("assertions", {})
          verdict = d.get("summary", {}).get("verdict")
          integrated = bool(browser.get("integrated_asset_loaded") and browser.get("integrated_assets_ready") and browser.get("integrated_asset_no_error"))
          manifest_ok = (m3.get("interchange_manifest", {}).get("status") == "exported")
          integrity_ok = (m3.get("integration", {}).get("staged_asset", {}).get("matches_export") is True)
          open("evidence/phase-m3/journey-ci/m3-g2-journey-gate-status.json", "w").write(json.dumps({
              "gate_id": "M3-G2",
              "layer": "in-app journey (final-closure handoff §11)",
              "status": "journey-verified" if (verdict == "pass" and integrated and manifest_ok and integrity_ok) else "not-verified",
              "integrated_asset_consumed_in_running_browser": integrated,
              "manifest_status_exported": manifest_ok,
              "staged_asset_matches_export_hash": integrity_ok,
              "recorded_at": f"{os.environ.get('GITHUB_RUN_ID', 'local')}-{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}",
          }, indent=2))
          open("evidence/phase-m3/journey-ci/m3-g5-journey-gate-status.json", "w").write(json.dumps({
              "gate_id": "M3-G5",
              "layer": "in-app journey (final-closure handoff §11)",
              "status": "journey-verified" if verdict == "pass" else "not-verified",
              "note": "a natural-language request completed across Blender and Babylon without manual repetition; M3-G1 stays honestly blocked (no licensed Unity runner)",
              "recorded_at": f"{os.environ.get('GITHUB_RUN_ID', 'local')}-{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}",
          }, indent=2))
          PY
      - name: Upload M3 journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-engine-journey-${{ github.sha }}
          path: evidence/phase-m3/journey-ci/
          if-no-files-found: warn
